version = 1

# Every file, so files added later need no header of their own. A file whose
# own header says otherwise keeps it.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ilia Gordeev <ilya.tanat@gmail.com>"
SPDX-License-Identifier = "MIT"

# The annotations below record where a file came from, or give a file with
# third-party content, or a file whose format asks for another license, its
# own license; where several annotations match a file, the last one wins.

[[annotations]]
path = "crates/addict-app/icons/*.png"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ilia Gordeev <ilya.tanat@gmail.com>"
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "source.png is the Gaudi mosaic letter a, made with an image-generation tool; the sizes are built from it by make-icons.py."

[[annotations]]
path = "docs/screenshot.png"
precedence = "closest"
SPDX-FileCopyrightText = [
    "2026 Ilia Gordeev <ilya.tanat@gmail.com>",
    "DBnary, Gilles Sérasset; Wiktionary contributors",
    "Karl Bartel / WikDict; Wiktionary contributors",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileComment = "The addict window with DBnary Catalan definitions and pronunciation (CC BY-SA), WikDict ca-ru Russian translations (CC BY-SA 4.0) and a DeepL translation."

[[annotations]]
path = "crates/addict-platform/tests/data/ocr-fixture.png"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ilia Gordeev <ilya.tanat@gmail.com>"
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "A sentence rendered for the EXP-4 experiment."

[[annotations]]
path = "crates/addict-core/tests/data/reduction-es-ca.tsv"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ilia Gordeev <ilya.tanat@gmail.com>"
SPDX-License-Identifier = "MIT"
SPDX-FileComment = "Written by EXP-9's rules.py over the project's own EXP-9 target word lists and the words of test_rules.py."

# The crates' own license texts and notices, as cargo-about collects them.
# Override: the texts quote SPDX tags of their own.
[[annotations]]
path = "packaging/licenses/crate-licenses.txt"
precedence = "override"
SPDX-FileCopyrightText = "The authors of the Rust crates listed in the file"
SPDX-License-Identifier = "MIT AND Apache-2.0 AND BSD-3-Clause AND ISC AND Unicode-3.0 AND Unlicense AND Zlib AND CDLA-Permissive-2.0 AND bzip2-1.0.6"
SPDX-FileComment = "Generated from Cargo.lock by scripts/crate-licenses.sh."

# AppStream asks for metadata under CC0-1.0.
[[annotations]]
path = "data/io.github.doqhu.Addict.metainfo.xml"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ilia Gordeev <ilya.tanat@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"
