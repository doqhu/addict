# cargo-about's configuration for crate-licenses.txt: the licenses of the
# crates compiled into the addict binary. scripts/crate-licenses.sh runs it.

# Where a crate offers a choice, the first of these it allows is taken.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# The Flatpak's architectures.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# addict's own crates: LICENSE covers them.
private = { ignore = true }
