[workspace]
resolver = "3"
members = ["crates/addict-core", "crates/addict-platform", "crates/addict-dictionary", "crates/addict-deepl", "crates/addict-app"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
