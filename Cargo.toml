[workspace]
resolver = "3"
members = ["crates/addict-probe", "crates/addict-exp4", "crates/addict-context", "crates/addict-ui-gtk"]
exclude = ["experiments/exp4/upstream", "crates/addict-ui-gpui"]
default-members = ["crates/addict-probe", "crates/addict-exp4", "crates/addict-context"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
