# The project's own gitleaks rules, which CI runs over the full history next
# to gitleaks' default rules. It does not extend the defaults: their global
# allowlist skips every path under /home/, and so would hide the second rule.
title = "addict"

# A DeepL authentication key: a UUID, with `:fx` on the free plan.
[[rules]]
id = "deepl-api-key"
description = "DeepL API authentication key"
regex = '''(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?::fx)?'''

# A path in a real home directory. The tests use the made-up `/home/u`.
[[rules]]
id = "home-path"
description = "Path in a home directory"
regex = '''/home/[A-Za-z0-9._-]+'''

[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^/home/u$''']
