name: Release Please

on:
  push:
    branches: [master]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # A personal access token, not GITHUB_TOKEN: events made with
      # GITHUB_TOKEN start no workflows, so the release pull request would
      # never get the status checks that master requires.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
