[package]
name = "addict-ui-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
addict-exp4 = { path = "../addict-exp4", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
futures = "=0.3.34"
gpui = { path = "../../experiments/exp4/upstream/crates/gpui", default-features = false, features = ["wayland"] }
gpui_platform = { path = "../../experiments/exp4/upstream/crates/gpui_platform", default-features = false, features = ["wayland"] }
libc = "=0.2.190"
unicode-segmentation = "=1.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
