[package]
name = "addict-dictionary"
version.workspace = true
description = "Addict dictionary index: the file format, its reader and the importers, GTK-free"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "addict_dictionary"
path = "src/lib.rs"

[dependencies]
addict-core = { path = "../addict-core" }
bzip2 = "=0.6.1"
flate2 = "=1.1.10"
lzma-rs = "=0.3.0"
quick-xml = "=0.41.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
# Only the builder of the published indexes, `examples/build-indexes.rs`,
# downloads; the library has no network code. The TLS is addict-deepl's:
# rustls with the bundled Mozilla roots.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
