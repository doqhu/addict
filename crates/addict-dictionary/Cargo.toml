[package]
name = "addict-dictionary"
version = "0.1.0"
description = "Addict dictionary index: the file format, its reader and the importers, GTK-free"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "addict_dictionary"
path = "src/lib.rs"

[dependencies]
addict-core = { path = "../addict-core" }
bzip2 = "=0.6.1"
flate2 = "=1.1.10"
lzma-rs = "=0.3.0"
quick-xml = "=0.41.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
