[package]
name = "addict-controller"
version.workspace = true
description = "Addict's platform-independent product controller"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
addict-core = { path = "../addict-core" }
addict-deepl = { path = "../addict-deepl" }
addict-dictionary = { path = "../addict-dictionary" }
addict-engine = { path = "../addict-engine" }
futures-channel = "0.3"

[dev-dependencies]
flate2 = "=1.1.10"
lzma-rs = "=0.3.0"
tokio = { version = "=1.53.2", features = ["macros", "rt", "io-util", "net"] }
