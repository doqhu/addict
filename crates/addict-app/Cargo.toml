[package]
name = "addict-app"
version = "0.1.0"
description = "Addict application: resident process and presentation"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "addict"
path = "src/main.rs"

[dependencies]
addict-core = { path = "../addict-core" }
addict-deepl = { path = "../addict-deepl" }
addict-dictionary = { path = "../addict-dictionary" }
addict-platform = { path = "../addict-platform" }
clap = { version = "=4.6.7", features = ["derive"] }
futures-channel = "=0.3.34"
futures-util = "=0.3.34"
gdk4-wayland = { version = "=0.11.5", features = ["wayland_crate"] }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_20"] }
libc = "=0.2.190"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["time"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client"] }

[dev-dependencies]
# The sample dictionary and translator are for tests only: the product cannot
# name them.
addict-core = { path = "../addict-core", features = ["sample"] }
# The stub of the DeepL server, for the tests only.
addict-deepl = { path = "../addict-deepl", features = ["stub"] }
# For the acceptance harness, the `harness` example, whose format and rules
# the evidence tests include.
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.2", features = ["macros", "process", "rt", "time"] }
