[package]
name = "addict-app"
version = "0.1.0"
description = "Addict application: resident process and presentation"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "addict"
path = "src/main.rs"

[dependencies]
addict-core = { path = "../addict-core" }
addict-platform = { path = "../addict-platform" }
clap = { version = "=4.6.7", features = ["derive"] }
futures-channel = "=0.3.34"
futures-util = "=0.3.34"
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_20"] }
tokio = { version = "=1.53.2", features = ["time"] }
