[package]
name = "addict-app"
version.workspace = true
description = "Addict application: resident process and presentation"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "addict"
path = "src/main.rs"

# The acceptance harness, not shipped. Its tests cover the command line;
# `addict-engine`'s `src/evidence.rs` includes and tests its rules.
[[example]]
name = "harness"
test = true

[dependencies]
addict-core = { path = "../addict-core" }
addict-deepl = { path = "../addict-deepl" }
addict-dictionary = { path = "../addict-dictionary" }
addict-engine = { path = "../addict-engine" }
addict-platform = { path = "../addict-platform" }
clap = { version = "=4.6.7", features = ["derive"] }
futures-channel = "=0.3.34"
futures-util = "=0.3.34"
gdk4-wayland = { version = "=0.11.5", features = ["wayland_crate"] }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_20"] }
libc = "=0.2.190"
# `rt` for `spawn_blocking`: the checks and the install of a downloaded
# index leave the runner's thread.
tokio = { version = "=1.53.2", features = ["rt", "sync", "time"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client"] }

[dev-dependencies]
# The sample dictionary and translator are for tests only: the product cannot
# name them.
addict-core = { path = "../addict-core", features = ["sample"] }
# The stub of the DeepL server, for the tests only.
addict-deepl = { path = "../addict-deepl", features = ["stub"] }
# For the acceptance harness, the `harness` example, whose format and rules
# the evidence tests include.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# `net` and `io-util` for the static-file stub of the download tests.
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "process", "rt", "time"] }
# The xz assets of the download tests.
lzma-rs = "=0.3.0"
# The mock Background portal of the uninstall tests; already in the product
# through addict-platform.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
