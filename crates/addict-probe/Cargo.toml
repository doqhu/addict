[package]
name = "addict-probe"
version = "0.1.0"
description = "EXP-3 probe: portal GlobalShortcuts, interactive Screenshot and bounded clipboard reads"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "addict_probe"
path = "src/lib.rs"

[[bin]]
name = "addict-probe"
path = "src/main.rs"

[dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "screenshot"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures-util = "=0.3.34"
imagesize = "=0.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt", "time", "process", "io-util"] }
wayland-client = "=0.31.15"
wl-clipboard-rs = "=0.9.4"

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["test-util", "rt-multi-thread"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
