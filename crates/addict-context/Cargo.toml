[package]
name = "addict-context"
version = "0.1.0"
description = "EXP-1/2 probe: selected word and its sentence over AT-SPI, read-only"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "addict_context"
path = "src/lib.rs"

[[bin]]
name = "addict-context"
path = "src/main.rs"

[dependencies]
addict-probe = { path = "../addict-probe" }
clap = { version = "=4.6.7", features = ["derive", "env"] }
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt", "time", "process", "io-util"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread"] }
