[package]
name = "addict-exp8"
version = "0.1.0"
description = "EXP-8: OCR quality on screenshots of real materials, through the recognition of the product"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "addict_exp8"
path = "src/lib.rs"

[[bin]]
name = "addict-exp8"
path = "src/main.rs"

[dependencies]
addict-platform = { path = "../addict-platform" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["macros", "rt", "signal"] }
