[package]
name = "addict-platform"
version = "0.1.0"
description = "Addict platform adapters: portal, AT-SPI and capture, GTK-free"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "addict_platform"
path = "src/lib.rs"

[dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "=0.3.34"
libc = "=0.2.190"
tokio = { version = "=1.53.2", features = ["macros", "rt", "sync", "time"] }
